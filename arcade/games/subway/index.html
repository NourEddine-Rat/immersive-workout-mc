<script>
// The boot check. Plain old JavaScript on purpose: it runs on any browser,
// including one that cannot run the game, and says so — a TV browser that
// lacks modules or WebGL would otherwise sit on "loading" forever.
(function () {
  // Diagnostic messages stay in this browser.

  var lines = [];

    errors: [],

    step: function (text) { var t = el('bootText'); if (t) t.textContent = text; this.lastAt = Date.now(); log('step ' + text); },

      var t = el('bootText');

  #perk .ring {position: absolute; left: 50%; top: 52%; width: 72px; height: 72px; margin: -36px 0 0 -36px; border: 4px solid #ffd35b; border-radius: 50%; opacity: 0;}
  #perk .ring.r2 {border-color: #ff8a1f;}
  #perk.in .ring {-webkit-animation: ring .6s ease-out .03s; animation: ring .6s ease-out .03s;}
  #perk.in .ring.r2 {-webkit-animation: ring .6s ease-out .15s; animation: ring .6s ease-out .15s;}
  @keyframes ring { 0% {opacity: .85; -webkit-transform: scale(.4); transform: scale(.4);} 100% {opacity: 0; -webkit-transform: scale(6.5); transform: scale(6.5);} }
  @-webkit-keyframes ring { 0% {opacity: .85; -webkit-transform: scale(.4);} 100% {opacity: 0; -webkit-transform: scale(6.5);} }
  #perkTitle {font-size: 44px; font-size: clamp(26px, 4.4vw, 44px); color: #ffd35b; color: var(--hud2); text-shadow: 0 5px 0 #5a2b00, 0 3px 10px rgba(0,0,0,0.95), 0 0 34px rgba(255,150,40,0.85); letter-spacing: .04em; margin-top: 6px; line-height: 1.1;}
  #perkCheer {font-size: 15px; color: #7ef0b6; margin-top: 10px; text-shadow: 0 2px 0 #06301f, 0 2px 8px rgba(0,0,0,0.95), 0 0 20px rgba(80,240,170,0.5);}
  #perkAr {direction: rtl; font-family: -apple-system, "SF Arabic", "Geeza Pro", system-ui, sans-serif; font-size: 20px; color: #ffd35b; margin-top: 6px; text-shadow: 0 2px 4px rgba(0,0,0,1), 0 0 16px rgba(0,0,0,0.9);}
  #kgWrap {display: -webkit-box; display: -webkit-flex; display: flex; gap: 2px; -webkit-box-align: center; -webkit-align-items: center; align-items: center;}
  #kgIn {width: 34px; font: inherit; color: #cfe9d8; background: none; border: 1px solid #ffffff26; border-radius: 5px; padding: 1px 4px; text-align: right; -moz-appearance: textfield;}
  #kgIn::-webkit-inner-spin-button, #kgIn::-webkit-outer-spin-button {-webkit-appearance: none; margin: 0;}   /* the spinner steals the digits' room */
  body.scanning #kcal, body.scanning #perk {display: none;}
  #credit {position: fixed; right: 12px; bottom: 8px; font-size: 10.5px; color: rgba(255,255,255,0.45); pointer-events: auto;}
  #credit a {color: rgba(255,255,255,0.65);}
</style>
</head>
<body>
<canvas id="lines"></canvas>
<div id="vignette"></div>
<div id="lookText">RUN!</div>
<div id="lookAr" class="ar-only">الكلب وراك — اركض!</div>

<div class="hud" id="topLeft"><span class="coin"></span><span id="coins">0</span></div>
<div class="hud" id="topCenter">
  <div id="level">LEVEL 1</div>
  <div class="progress"><span>START</span><div class="track"><div id="bar"></div></div><span>FINISH</span></div>
</div>
<div class="hud" id="topRight">
  <canvas id="pose" width="304" height="124"></canvas>
  <div id="stats"><span id="dist">0m</span><span id="kcal"><i class="flame"></i><span id="kcalN">0</span> kcal</span></div>
  <div id="who"><span id="whoText">no profile yet</span><label id="kgWrap"><input id="kgIn" type="number" min="30" max="200" step="1">kg</label><button id="newProfile">new</button></div>
</div>
<div class="hud" id="perk" hidden><div class="plate">
  <div class="crest"><span class="ring"></span><span class="ring r2"></span><i id="perkFire"></i></div>
  <div id="perkTitle">25 KCAL</div>
  <div id="perkCheer">Keep it burning!</div>
  <div id="perkAr" class="ar-only">استمر!</div>
</div></div>
<div class="hud" id="hint" hidden><div id="hintArrow">▲</div><div id="hintText">JUMP!</div></div>


<div id="dev" hidden><span>DEV</span> level <input id="devLevel" type="number" min="1" max="99" value="1"> <button id="devGo">go</button> <span class="k">Space jump · S slide · 1–9 level · +/− · M mode · F fire · T hour</span></div>
<div id="overlay"><div class="card"><h1 id="overlayTitle">LOADING</h1><div id="overlayText"><div id="bootBox"></div><div id="bootTrack"><div id="bootBar"></div></div><div id="bootText">checking the browser…</div></div><div class="btns" id="overlayBtns" hidden></div></div></div>

<script type="module" src="./game.js"></script>
</body>
</html>
