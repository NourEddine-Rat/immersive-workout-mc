<!doctype html>
<html lang="en">
<head>
        <script src="/engine/connection-diagnostics.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Track &amp; Field · Squid Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../common/squid.css">
<script type="importmap">{ "imports": { "three": "../../../engine/three/three.module.js" } }</script>
<link rel="stylesheet" href="/engine/boot.css">
<script src="/engine/boot.js"></script>
</head>
<body class="menu track">
<canvas id="splat"></canvas>
<div id="vignette"></div>
<div id="flash"></div>

<div class="hud" id="topLeft">
  <div id="badge"><span class="num">4</span><span class="lbl">LANE<br>YOU</span></div>
  <div id="left">PLACE <b id="placeN">1/6</b></div>
  <div id="left2">HURDLES <b id="hurdlesN">0/10</b></div>
  <div id="feed" class="track"></div>
</div>

<div class="hud" id="topCenter">
  <div id="lightRow"><span id="light" class="rope"></span><span id="lightWord" class="rope">400 M HURDLES</span></div>
  <div id="track"><div class="lab"><b id="toGo">60</b><span>m to go</span></div><div class="bar"><div class="fill" id="trackFill"></div><div class="ticks"></div><div class="rivals" id="rivals"></div><div class="finish"></div><div class="me" id="trackMe"><i>YOU</i></div></div><div class="lab line"><span>FINISH</span></div></div>
</div>

<div class="hud" id="topRight">
  <div id="clock">0:00.0</div>
  <canvas id="pose" width="304" height="124"></canvas>
  <div id="stats"><span id="dist">0 m</span><span id="kcal"><i class="fl"></i><span id="kcalN">0</span> kcal</span></div>
  <div id="who"><span id="whoText">no profile yet</span><label><input id="kgIn" type="number" min="30" max="200" step="1">kg</label><button id="newProfile">new</button></div>
</div>

<div class="hud" id="callout">GREEN LIGHT</div>
<div id="win" hidden>
  <div class="burst" id="winBurst"></div>
  <svg class="winMedal" viewBox="0 0 120 120"><path d="M38 4 L60 44 L82 4" fill="none" stroke="#ff7a1a" stroke-width="10" stroke-linejoin="round"/><circle cx="60" cy="74" r="36" fill="#ffc83a" stroke="#fff3c4" stroke-width="5"/><circle cx="60" cy="74" r="24" fill="none" stroke="#c98a10" stroke-width="3"/><path d="M60 58 l5 10 11 1.5 -8 7.5 2 11 -10 -5.5 -10 5.5 2 -11 -8 -7.5 11 -1.5 z" fill="#c98a10"/></svg>
  <div class="winKicker" id="winKicker">LANE 4</div>
  <div class="winBand"><div class="winTitle" id="winTitle">FINISHED</div></div>
  <div class="winSub" id="winSub">—</div>
</div>
<div class="hud" id="tip"></div>
<div class="hud" id="hint" hidden><div id="hintArrow">▲</div><div id="hintText">JUMP!</div></div>
<div class="hud" id="meter"><div class="lbl" id="meterLbl">HOLD STILL</div><div class="bar"><i id="meterBar"></i></div></div>



<div id="dev" hidden></div>
<div id="overlay"><div class="card"><h1 id="overlayTitle">LOADING</h1><div id="overlayText"></div><div class="btns" id="overlayBtns" hidden></div></div></div>
<div id="credit">Stadium: "Track &amp; Field" (source to be credited) · Trees: <a href="https://polyhaven.com/models/nature" target="_blank">Poly Haven</a> (CC0) · Players: <a href="https://sketchfab.com/3d-models/squid-game-player-rig-version-616190e0b99544b5bf92b76354910355" target="_blank">Luxor</a> (CC-BY) · Arms: <a href="https://sketchfab.com/3d-models/free-gameready-fps-female-arms-007f5dd998ad4376943ed6fb3dfa2e15" target="_blank">BAMEN</a> (CC-BY)</div>

<script type="module" src="./game.js"></script>
</body>
</html>
