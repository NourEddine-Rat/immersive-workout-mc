<!doctype html>
<html lang="en">
<head>
        <script src="/engine/connection-diagnostics.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Red Light, Green Light · Squid Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../common/squid.css">
<script type="importmap">{ "imports": { "three": "../../../engine/three/three.module.js" } }</script>
<link rel="stylesheet" href="/engine/boot.css">
<script src="/engine/boot.js"></script>
</head>
<body class="menu">
<canvas id="splat"></canvas>
<div id="vignette"></div>
<div id="flash"></div>

<div class="hud" id="topLeft">
  <div id="badge"><span class="num">456</span><span class="lbl">PLAYER<br>YOU</span></div>
  <div id="left">REMAINING <b id="leftN">57</b></div>
  <div id="pot"><span class="pig"></span>₩ <span id="potN">0</span></div>
  <div id="feed"></div>
</div>

<div class="hud" id="topCenter">
  <div id="lightRow"><span id="light"></span><span id="lightWord">WAIT</span></div>
  <div id="song"></div>
  <div id="track"><div class="lab"><b id="toGo">60</b><span>m to go</span></div><div class="bar"><div class="fill" id="trackFill"></div><div class="ticks"></div><div class="finish"></div><div class="me" id="trackMe"><i>456</i></div></div><div class="lab line"><span>LINE</span></div></div>
</div>

<div class="hud" id="topRight">
  <div id="clock">03:00</div>
  <canvas id="pose" width="304" height="124"></canvas>
  <div id="stats"><span id="dist">0 m</span><span id="kcal"><i class="fl"></i><span id="kcalN">0</span> kcal</span></div>
  <div id="who"><span id="whoText">no profile yet</span><label><input id="kgIn" type="number" min="30" max="200" step="1">kg</label><button id="newProfile">new</button></div>
</div>

<div class="hud" id="callout">GREEN LIGHT</div>
<div id="win" hidden>
  <div class="burst" id="winBurst"></div>
  <svg class="winShapes" viewBox="0 0 240 70"><circle cx="35" cy="35" r="26"/><path d="M120 9 L148 61 L92 61 Z"/><rect x="179" y="9" width="52" height="52"/></svg>
  <div class="winKicker">PLAYER 456</div>
  <div class="winBand"><div class="winTitle">PASSED</div></div>
  <div class="winSub" id="winSub">—</div>
</div>
<div class="hud" id="tip"></div>
<div class="hud" id="hint" hidden><div id="hintArrow">▲</div><div id="hintText">JUMP!</div></div>
<div class="hud" id="meter"><div class="lbl" id="meterLbl">HOLD STILL</div><div class="bar"><i id="meterBar"></i></div></div>
<div class="hud" id="perk" hidden><div id="perkShape">○</div><div id="perkTitle">+10 SECONDS</div><div id="perkSay">…</div></div>
<div id="inv"></div>


<div id="fade"></div>
<div id="dev" hidden></div>
<div id="overlay"><div class="card"><div class="shapes">○ △ □</div><h1 id="overlayTitle">LOADING</h1><div id="overlayText"></div><div class="btns" id="overlayBtns" hidden></div></div></div>
<div id="credit">Arena: <a href="https://sketchfab.com/3d-models/squid-game-red-light-green-light-game-room-207427ee5a0f403e904c145aeb457195" target="_blank">JohnWick007</a> (CC-BY-NC-SA) · Players: <a href="https://sketchfab.com/3d-models/squid-game-player-rig-version-616190e0b99544b5bf92b76354910355" target="_blank">Luxor</a> (CC-BY) · Arms: <a href="https://sketchfab.com/3d-models/free-gameready-fps-female-arms-007f5dd998ad4376943ed6fb3dfa2e15" target="_blank">BAMEN</a> (CC-BY)</div>

<script type="module" src="./game.js"></script>
</body>
</html>
