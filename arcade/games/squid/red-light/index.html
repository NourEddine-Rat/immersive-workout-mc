<script>
// The boot check (subway's, trimmed): plain JavaScript, so a browser that
// cannot run the game says why instead of sitting on "loading". Diagnostics stay local.
(function () {
  function log(line) { if (window.console && console.debug) console.debug(line); }
  window.__log = log;
  log('page ' + location.pathname + location.search + ' | ' + navigator.userAgent);
  function el(id) { return document.getElementById(id); }
  var boot = window.__boot = {
    checks: [], errors: [], ok: true,
    check: function (name, pass, fix) { this.checks.push({ name: name, pass: !!pass, fix: fix }); if (!pass) this.ok = false; },
    render: function () { var h = ''; for (var i = 0; i < this.checks.length; i++) { var c = this.checks[i]; h += '<div class="chk ' + (c.pass ? 'ok' : 'no') + '">' + (c.pass ? '✓' : '✗') + ' ' + c.name + (c.pass ? '' : ' — ' + c.fix) + '</div>'; } for (var j = 0; j < this.errors.length; j++) h += '<div class="chk no">✗ ' + this.errors[j] + '</div>'; var b = el('bootBox'); if (b) b.innerHTML = h; },
    progress: function (what, done, total) { var pct = total ? Math.round(100 * done / total) : 0; var bar = el('bootBar'); if (bar) bar.style.width = pct + '%'; var t = el('bootText'); if (t) t.textContent = 'downloading ' + what + ' · ' + (done / 1048576).toFixed(1) + (total ? ' of ' + (total / 1048576).toFixed(1) : '') + ' MB'; },
    step: function (text) { var t = el('bootText'); if (t) t.textContent = text; log('step ' + text); },
    fail: function (text) { this.ok = false; if (this.errors.length < 4) this.errors.push(text); log('FAIL ' + text); this.render(); var t = el('bootText'); if (t) t.textContent = 'The game hit an error — the red line above says where.'; }
  };
  window.addEventListener('DOMContentLoaded', function () {
    var gl = null; try { var c = document.createElement('canvas'); gl = c.getContext('webgl2') || c.getContext('webgl'); } catch (e) {}
    boot.check('WebGL', !!gl, 'no 3D graphics in this browser');
    boot.check('modern browser', 'noModule' in document.createElement('script'), 'this game needs a recent Chrome, Safari or Edge');
    boot.render();
  });
  window.addEventListener('error', function (e) { var where = e.filename ? ' (' + String(e.filename).replace(/^.*\//, '') + ':' + e.lineno + ')' : ''; log('error ' + (e.message || e.error) + where); if (!window.__gameUp) boot.fail('The game could not start: ' + (e.message || e.error) + where); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; log('rejection ' + (r && r.message || r)); if (!window.__gameUp) boot.fail('The game could not start: ' + (r && r.message || r)); });
})();
</script>
